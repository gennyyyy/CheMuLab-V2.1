<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Puzzle - CheMuLab</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/route-protection.js"></script>
    <style>
        .game-area {
            max-width: 800px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .instructions {
            margin-bottom: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 5px;
        }

        .puzzle-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            gap: 5px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .puzzle-slot {
            width: 50px;
            height: 50px;
            border: 2px dashed #999;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            background: #fff;
        }

        .puzzle-slot.filled {
            border: 2px solid #4CAF50;
            background: #e8f5e9;
        }

        .puzzle-slot.wrong {
            border: 2px solid #f44336;
            background: #ffebee;
        }

        .puzzle-slot.correct {
            border: 2px solid #4CAF50;
            background: #c8e6c9;
        }

        .puzzle-slot.droppable {
            border-color: #2196F3;
            background: #e3f2fd;
        }

        .pieces-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 250px;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .puzzle-piece {
            width: 45px;
            height: 45px;
            background: #2196F3;
            color: #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: grab;
            transition: transform 0.1s;
        }

        .puzzle-piece:hover {
            transform: scale(1.1);
        }

        .puzzle-piece.dragging {
            opacity: 0.5;
        }

        .controls {
            margin-top: 20px;
        }

        .check-btn,
        .reset-btn {
            padding: 10px 25px;
            font-size: 1em;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .check-btn {
            background: #4CAF50;
            color: #fff;
        }

        .reset-btn {
            background: #757575;
            color: #fff;
        }

        .result-message {
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="top-bar">
            <span class="logo">CheMuLab</span>
            <button id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
            <div class="nav-links"></div>
            <div id="userStatus" class="sign-in">
                <span id="userStatusText"></span>
            </div>
        </div>

        <div class="sidebar">
            <a href="index.html" class="sidebar-item">
                <div class="sidebar-icon">&#127968;</div> Home
            </a>
            <a href="your_lab.html" class="sidebar-item">
                <div class="sidebar-icon">&#129514;</div> Your Lab
            </a>
            <a href="friends.html" class="sidebar-item">
                <div class="sidebar-icon">&#128101;</div> Friends
            </a>
            <a href="elements.html" class="sidebar-item">
                <div class="sidebar-icon">&#9883;</div> Elements
            </a>
            <a href="games.html" class="sidebar-item active">
                <div class="sidebar-icon">&#127918;</div> Games
            </a>
            <a href="profile.html" class="sidebar-item">
                <div class="sidebar-icon">&#128100;</div> Profile
            </a>
            <a href="about.html" class="sidebar-item">
                <div class="sidebar-icon">&#8505;</div> About
            </a>
        </div>

        <div class="main-content">
            <div style="margin-bottom: 20px;">
                <a href="games.html" style="text-decoration:none; color:#000;">&larr; Back to Games</a>
            </div>

            <div class="game-area">
                <h1>🧩 Periodic Puzzle</h1>
                <div class="instructions">
                    Drag the element symbols to their correct positions!<br>
                    Fill in the first 18 elements of the periodic table.
                </div>

                <div class="puzzle-container">
                    <div>
                        <h3>Periodic Table (First 3 Rows)</h3>
                        <div class="puzzle-grid" id="puzzleGrid">
                            <!-- Slots will be generated -->
                        </div>
                    </div>
                    <div>
                        <h3>Element Pieces</h3>
                        <div class="pieces-tray" id="piecesTray">
                            <!-- Pieces will be generated -->
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button class="check-btn" id="checkBtn">Check Answer</button>
                    <button class="reset-btn" id="resetBtn">Reset</button>
                </div>
                <div class="result-message" id="resultMessage"></div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
    <script src="js/periodic-puzzle.js"></script>
</body>

</html>
