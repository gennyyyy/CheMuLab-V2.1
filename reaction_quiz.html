<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Quiz - CheMuLab</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase Client SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <!-- App Configuration and Services -->
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/route-protection.js"></script>
    <script src="js/reactions-data.js"></script>
    <style>
        .game-area {
            max-width: 650px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .score-board {
            font-size: 1.2em;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .question-box {
            font-size: 1.5em;
            margin: 30px 0;
            padding: 20px;
            background: #fff3e0;
            border-radius: 8px;
            font-weight: bold;
        }

        .reaction-equation {
            font-size: 1.8em;
            color: #e65100;
            margin: 10px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            padding: 15px;
            font-size: 1.1em;
            cursor: pointer;
            background: #ffcc80;
            border: 2px solid #000;
            border-radius: 8px;
            transition: transform 0.1s;
        }

        .option-btn:hover {
            transform: scale(1.02);
            background: #ffa726;
            color: #fff;
        }

        .option-btn.correct {
            background: #4CAF50;
            color: white;
        }

        .option-btn.wrong {
            background: #f44336;
            color: white;
        }

        .feedback {
            height: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .next-btn {
            padding: 10px 20px;
            font-size: 1em;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] .game-area {
            background: var(--bg-card);
            color: var(--text-main);
        }

        [data-theme="dark"] .question-box {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        [data-theme="dark"] .option-btn {
            background: var(--bg-sidebar);
            color: var(--text-main);
            border-color: var(--border-color);
        }

        [data-theme="dark"] .option-btn:hover {
            background: var(--bg-card-hover);
        }

        [data-theme="dark"] .option-btn.correct {
            background: #4CAF50 !important;
            color: #fff !important;
            border-color: #4CAF50 !important;
        }

        [data-theme="dark"] .option-btn.wrong {
            background: #f44336 !important;
            color: #fff !important;
            border-color: #f44336 !important;
        }
    </style>
</head>

<body>
    <div class="app-container no-transition sidebar-collapsed">
        <div class="top-bar">
            <div class="header-left">
                <button id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
                <span class="logo">CheMuLab</span>
            </div>
            <div class="nav-links">
            </div>
            <div id="userStatus" class="sign-in">
                <span id="userStatusText"></span>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-nav">
                <a href="index.html" class="sidebar-item">
                    <div class="sidebar-icon">&#127968;</div> Home
                </a>
                <a href="your_lab.html" class="sidebar-item">
                    <div class="sidebar-icon">&#129514;</div> Your Lab
                </a>
                <a href="friends.html" class="sidebar-item">
                    <div class="sidebar-icon">&#128101;</div> Friends
                </a>
                <a href="elements.html" class="sidebar-item">
                    <div class="sidebar-icon">&#9883;</div> Elements
                </a>
                <a href="games.html" class="sidebar-item active">
                    <div class="sidebar-icon">&#127918;</div> Games
                </a>
                <a href="about.html" class="sidebar-item">
                    <div class="sidebar-icon">&#8505;</div> About
                </a>
            </div>
            <div class="sidebar-footer">
                <div id="sidebarLogoutContainer"></div>
            </div>
        </div>

        <div class="main-content">
            <div>
                <a href="games.html" class="back-btn">&larr; Back to Games</a>
            </div>

            <div class="game-area">
                <h1>⚗️ Reaction Quiz</h1>
                <div class="score-board">
                    <span>Score: <span id="score">0</span></span>
                    <span>Streak: <span id="streak">0</span></span>
                    <span>Lives: <span id="lives">3</span></span>
                </div>

                <div class="question-box" id="questionBox">
                    <div>What is the product of:</div>
                    <div class="reaction-equation" id="question">Loading...</div>
                </div>

                <div class="feedback" id="feedback"></div>

                <div class="options-grid" id="options">
                    <!-- Options will be generated here -->
                </div>

                <button class="next-btn" id="nextBtn">Next Question</button>

                <!-- Game Over Screen -->
                <div class="game-area" id="gameOverScreen"
                    style="display: none; box-shadow: none; margin: 0; padding: 0;">
                    <h2 style="color: red;">Game Over!</h2>
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <button class="next-btn" id="restartBtn" style="display: inline-block; background: #4CAF50;">Play
                        Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
    <script>
        // Force sidebar collapsed for games instantly
        (function () {
            const app = document.querySelector('.app-container');
            if (app) {
                app.classList.add('sidebar-collapsed', 'no-transition');
                document.addEventListener('DOMContentLoaded', () => {
                    app.classList.add('sidebar-collapsed');
                    setTimeout(() => app.classList.remove('no-transition'), 100);
                });
            }
        })();
    </script>
    <script src="js/reaction-quiz.js"></script>
</body>

</html>
