<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole - CheMuLab</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/route-protection.js"></script>
    <script src="js/elements-data.js"></script>
    <style>
        .game-area {
            max-width: 95%;
            width: 900px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .score-board {
            font-size: 1.2em;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .timer-bar {
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.1s linear;
        }

        .instructions {
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 5px;
        }

        .mole-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .mole-hole {
            aspect-ratio: 1;
            background: #795548;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            border: 3px solid #5d4037;
        }

        .mole-hole:hover {
            transform: scale(1.05);
        }

        .mole-hole.active {
            background: #ffeb3b;
            animation: pop 0.2s ease-out;
        }

        .mole-hole.heavy-metal {
            background: #ff5722;
            color: #fff;
        }

        .mole-hole.clicked-correct {
            background: #4CAF50 !important;
            color: #fff;
        }

        .mole-hole.clicked-wrong {
            background: #f44336 !important;
            color: #fff;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
            }

            100% {
                transform: scale(1);
            }
        }

        .start-btn,
        .restart-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .game-over {
            display: none;
            font-size: 1.5em;
            margin: 20px 0;
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] .game-area {
            background: var(--bg-card);
            color: var(--text-main);
        }

        [data-theme="dark"] .instructions {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="top-bar">
            <span class="logo">CheMuLab</span>
            <button id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
            <div class="nav-links"></div>
            <div id="userStatus" class="sign-in">
                <span id="userStatusText"></span>
            </div>
        </div>

        <div class="sidebar">
            <a href="index.html" class="sidebar-item">
                <div class="sidebar-icon">&#127968;</div> Home
            </a>
            <a href="your_lab.html" class="sidebar-item">
                <div class="sidebar-icon">&#129514;</div> Your Lab
            </a>
            <a href="friends.html" class="sidebar-item">
                <div class="sidebar-icon">&#128101;</div> Friends
            </a>
            <a href="elements.html" class="sidebar-item">
                <div class="sidebar-icon">&#9883;</div> Elements
            </a>
            <a href="games.html" class="sidebar-item active">
                <div class="sidebar-icon">&#127918;</div> Games
            </a>
            <a href="profile.html" class="sidebar-item">
                <div class="sidebar-icon">&#128100;</div> Profile
            </a>
            <a href="about.html" class="sidebar-item">
                <div class="sidebar-icon">&#8505;</div> About
            </a>
        </div>

        <div class="main-content">
            <div>
                <a href="games.html" class="back-btn">&larr; Back to Games</a>
            </div>

            <div class="game-area">
                <h1>⚖️ Whack-a-Mole: Heavy Metals!</h1>
                <div class="score-board">
                    <span>Score: <span id="score">0</span></span>
                    <span>Time: <span id="time">30</span>s</span>
                </div>
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>

                <div class="instructions">
                    Click <strong>ONLY</strong> the heavy metals (Pb, Hg, Cd, As, etc.)!<br>
                    Avoid clicking non-heavy metals or you lose points!
                </div>

                <div class="mole-grid" id="moleGrid">
                    <!-- 16 holes -->
                </div>

                <button class="start-btn" id="startBtn">Start Game</button>
                <div class="game-over" id="gameOver">
                    Game Over! Final Score: <span id="finalScore">0</span>
                    <br><br>
                    <button class="restart-btn" id="restartBtn">Play Again</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
    <script src="js/whack-a-mole.js"></script>
</body>

</html>
